openapi: 3.0.4
info:
  title: NovaShop API
  description: |
    REST API for NovaShop, a full stack e-commerce app.

    **How to try protected endpoints:** call `POST /auth/login`, copy the `token`,
    click **Authorize** at the top of this page and paste it.
  version: 1.0.0
servers:
  - url: http://localhost:3000/api

tags:
  - name: Auth
  - name: Catalog
  - name: Orders
  - name: Admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    Member:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [customer, admin] }
        avatarUrl: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        token: { type: string }
        member: { $ref: '#/components/schemas/Member' }
    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        productCount: { type: integer }
    Variant:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string, example: LAP-001-MIDNIGHT-512GB }
        colorName: { type: string, example: Midnight }
        colorHex: { type: string, example: "#2e3642" }
        sizeLabel: { type: string, nullable: true, example: 512GB }
        price: { type: number, example: 32900 }
        stock: { type: integer }
        imageUrl: { type: string, nullable: true }
    Product:
      type: object
      properties:
        id: { type: integer }
        sku: { type: string }
        name: { type: string }
        tagline: { type: string }
        description: { type: string }
        specs: { type: object, additionalProperties: { type: string }, example: { Display: "14-inch 2.8K", Battery: "Up to 18 hours" } }
        sizeOptionName: { type: string, nullable: true, example: Storage }
        price: { type: number, description: Lowest variant price ("From" price) }
        stock: { type: integer, description: Total stock of all variants }
        imageUrl: { type: string, nullable: true }
        isFeatured: { type: boolean }
        colors:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              hex: { type: string }
              imageUrl: { type: string }
        variants:
          type: array
          description: Included on GET /products/{id} and when filtering by ids
          items: { $ref: '#/components/schemas/Variant' }
        brand: { $ref: '#/components/schemas/Brand' }
        category: { $ref: '#/components/schemas/Category' }
    ProductInput:
      type: object
      required: [sku, name, variants]
      properties:
        sku: { type: string, example: ACC-010 }
        name: { type: string, example: Lumen Desk Lamp }
        tagline: { type: string, example: Light where you need it. }
        description: { type: string }
        specs: { type: object, example: { Power: "8 W" } }
        sizeOptionName: { type: string, nullable: true, example: Size }
        isFeatured: { type: boolean }
        variants:
          type: array
          description: Existing variants keep their id; variants left out are deleted
          items:
            type: object
            required: [price]
            properties:
              id: { type: integer }
              colorName: { type: string, example: White }
              colorHex: { type: string, example: "#ffffff" }
              sizeLabel: { type: string, example: S }
              price: { type: number, example: 990 }
              stock: { type: integer, example: 20 }
        brandId: { type: integer, example: 3 }
        categoryId: { type: integer, example: 3 }
    OrderInput:
      type: object
      required: [items, shippingName, shippingPhone, shippingAddress]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              variantId: { type: integer, example: 30 }
              quantity: { type: integer, example: 1 }
        shippingName: { type: string, example: Somchai Jaidee }
        shippingPhone: { type: string, example: "0812345678" }
        shippingAddress: { type: string, example: "199 Sukhumvit Rd, Si Racha, Chonburi 20230" }
    Order:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, paid, shipped, delivered, cancelled] }
        total: { type: number }
        createdAt: { type: string, format: date-time }
        shippingName: { type: string }
        shippingPhone: { type: string }
        shippingAddress: { type: string }
        customer:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: integer }
              variantId: { type: integer }
              name: { type: string }
              variantLabel: { type: string, example: "Midnight, 512GB" }
              unitPrice: { type: number }
              quantity: { type: integer }

  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid token
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Admins only
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Create a customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email: { type: string, example: jane@example.com }
                name: { type: string, example: Jane }
                password: { type: string, example: secret123, minLength: 8 }
      responses:
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Email already registered }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: admin@novashop.test }
                password: { type: string, example: Admin123! }
      responses:
        '200': { description: Logged in, content: { application/json: { schema: { $ref: '#/components/schemas/AuthResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in member
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Auth]
      summary: Update display name
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { name: { type: string } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }

  /auth/me/avatar:
    post:
      tags: [Auth]
      summary: Upload a profile picture
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { image: { type: string, format: binary } } }
      responses:
        '200': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }

  /products:
    get:
      tags: [Catalog]
      summary: List products with search, filters, sorting and pagination
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Search in name and description }
        - { name: category, in: query, schema: { type: string }, description: Category slug, e.g. audio }
        - { name: brand, in: query, schema: { type: integer } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: inStock, in: query, schema: { type: boolean } }
        - { name: featured, in: query, schema: { type: boolean } }
        - { name: ids, in: query, schema: { type: string }, description: Comma-separated product ids (used by the compare page) }
        - { name: sort, in: query, schema: { type: string, enum: [featured, newest, price_asc, price_desc, name] } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 12, maximum: 50 } }
      responses:
        '200':
          description: A page of products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Product' } }
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      limit: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
    post:
      tags: [Admin]
      summary: Create a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: SKU already exists }

  /products/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Catalog]
      summary: Get one product
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Admin]
      summary: Update a product
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProductInput' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      summary: Delete a product
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /products/{id}/image:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Admin]
      summary: Upload a product image (JPG, PNG or WEBP, max 2 MB), optionally for one color
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { image: { type: string, format: binary }, color: { type: string, example: Midnight } } }
      responses:
        '200': { description: Uploaded, content: { application/json: { schema: { $ref: '#/components/schemas/Product' } } } }

  /brands:
    get:
      tags: [Catalog]
      summary: List brands
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Brand' } } } } }

  /categories:
    get:
      tags: [Catalog]
      summary: List categories with product counts
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Category' } } } } }

  /orders:
    post:
      tags: [Orders]
      summary: Place an order (checks and reduces stock in one transaction)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: Not enough stock }
    get:
      tags: [Orders]
      summary: List my orders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Order' } } } } }

  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [Orders]
      summary: Get one of my orders (admins can see any order)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /orders/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [Orders]
      summary: Cancel a pending order and return items to stock
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
        '409': { description: Order is no longer pending }

  /admin/stats:
    get:
      tags: [Admin]
      summary: Dashboard numbers (revenue, orders, low stock, sales by category)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/orders:
    get:
      tags: [Admin]
      summary: List all orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, shipped, delivered, cancelled] } }
      responses:
        '200': { description: OK }

  /admin/orders/{id}/status:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      tags: [Admin]
      summary: Change an order's status
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, paid, shipped, delivered, cancelled] }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Order' } } } }
